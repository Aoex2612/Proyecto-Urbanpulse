name: Integracion Continua (CI)

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  # =========================================================================
  # JOB 1: BACKEND (Java 21 + Spring Boot + Maven + JaCoCo)
  # =========================================================================
  backend:
    name: Backend - Tests y Cobertura (Java 21)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar y ejecutar tests unitarios con JaCoCo
        run: mvn -B clean test

      - name: Publicar reporte HTML de cobertura JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-jacoco
          path: Backend/target/site/jacoco/
          retention-days: 14

  # =========================================================================
  # JOB 2: FRONTEND (Node 20 + React 19 + Vitest + ESLint)
  # =========================================================================
  frontend:
    name: Frontend - Linter y Tests (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Instalar dependencias limpias (npm ci)
        run: npm ci

      - name: Validar estilo y buenas practicas de codigo (ESLint)
        run: npm run lint

      - name: Ejecutar bateria de pruebas con cobertura (Vitest)
        run: npm run test:coverage

      - name: Publicar reporte de cobertura de frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-cobertura-frontend
          path: frontend/coverage/
          retention-days: 14
