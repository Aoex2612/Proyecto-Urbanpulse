# ===================================================================
# UrbanPulse Backend - Configuración de la aplicación
# ===================================================================

spring.application.name=UrbanPulse
# spring.profiles.active=dev

# Servidor
server.port=8080

# Conexión a Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/urban_pulse_db
spring.datasource.username=admin
spring.datasource.password=database
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Configuración JWT
# Clave secreta segura de 512 bits en hexadecimal (garantiza >256 bits requeridos)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B59703273357638792F423F4528482B4D6251655468576D5A7134743777217A25432A
# Tiempo de expiración del token JWT en milisegundos: 86.400.000 ms (24 horas)
jwt.expiration=86400000

# Configuración de Carga de Archivos Multimedia
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
