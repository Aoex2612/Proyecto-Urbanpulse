# Base de datos H2 en memoria compatible con modo PostgreSQL para tests
spring.datasource.url=jdbc:h2:mem:urban_pulse_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Configuración de Carga de Archivos Multimedia para tests
app.upload.dir=target/test-uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
