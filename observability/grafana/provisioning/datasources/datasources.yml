apiVersion: 1

datasources:
  # Prometheus: Métricas temporales (latencias, throughput, uso de conexiones, etc.)
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "3s"
      httpMethod: "POST"

  # Loki (Preparado para la integración futura de logs)
  # Se activará cuando se despliegue el contenedor de Loki y Promtail/Logback appender
  # - name: Loki
  #   type: loki
  #   access: proxy
  #   url: http://loki:3100
