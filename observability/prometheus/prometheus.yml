global:
  scrape_interval: 5s       # Intervalo de sondeo global (5s para captar bien la variabilidad de k6)
  evaluation_interval: 5s   # Frecuencia de evaluación de reglas

scrape_configs:
  # Métricas internas del propio Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métricas de hardware y sistema operativo (CPU, RAM, Disco, Red)
  - job_name: 'node-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'host-system'

  # Métricas de la aplicación Spring Boot (UrbanPulse Backend)
  - job_name: 'urban-pulse-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s    
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'urban-pulse-backend'
          environment: 'local'
